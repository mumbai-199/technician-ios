name: iOS Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'technician app/**'
      - 'technician app/.github/workflows/ios-build.yml'

jobs:
  build_ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable

      - name: Check Flutter version
        working-directory: 'technician app'
        run: flutter --version

      - name: Get Flutter dependencies
        working-directory: 'technician app'
        run: flutter pub get

      - name: Setup Ruby for CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods
        working-directory: 'technician app'
        run: sudo gem install cocoapods

      - name: Debug Flutter environment
        working-directory: 'technician app'
        run: |
          echo ">>> which flutter: $(which flutter)"
          echo ">>> flutter --version:"
          flutter --version
          echo ">>> FLUTTER_ROOT: ${FLUTTER_ROOT:-<not set>}"
          echo ">>> Generated Flutter SDK root:"
          grep '^FLUTTER_ROOT=' ios/Flutter/Generated.xcconfig
          ruby -c ios/Podfile

      - name: Install iOS pods
        working-directory: 'technician app/ios'
        run: pod install --repo-update

      - name: Analyze project
        working-directory: 'technician app'
        continue-on-error: true
        run: flutter analyze

      - name: Build iOS app without codesign
        working-directory: 'technician app'
        run: flutter build ios --release --no-codesign

      - name: Create keychain for signing
        working-directory: 'technician app'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | awk '{print $1}')

      - name: Import provisioning profile
        working-directory: 'technician app'
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -e
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Prepare export options
        working-directory: 'technician app'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
        run: |
          set -e
          mkdir -p .github/ios
          cat > .github/ios/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Create iOS archive
        working-directory: 'technician app'
        run: |
          set -e
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            archive

      - name: Export IPA
        working-directory: 'technician app'
        run: |
          set -e
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist .github/ios/exportOptions.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: technician-ios-ipa
          path: 'technician app/build/ios/ipa/*.ipa'
          if-no-files-found: error
