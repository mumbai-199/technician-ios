name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure Xcode workspace exists
        run: |
          if [ -f ios/Podfile ]; then
            if ! command -v pod >/dev/null 2>&1; then
              sudo gem install cocoapods --no-document
            fi
            (cd ios && pod install)
          fi

          if [ ! -f ios/Runner.xcworkspace/contents.xcworkspacedata ]; then
            mkdir -p ios/Runner.xcworkspace
            cat > ios/Runner.xcworkspace/contents.xcworkspacedata <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Workspace version="1.0">
            <FileRef location="group:Runner.xcodeproj"/>
          </Workspace>
          EOF
          fi

      - name: Build iOS app
        run: flutter build ios --release --no-codesign

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/iphoneos/Runner.app
