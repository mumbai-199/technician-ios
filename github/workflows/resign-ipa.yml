name: Resign IPA (p12+mobileprovision)

on:
  workflow_dispatch:

jobs:
  resign:
    runs-on: macos-latest
    env:
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure runner.ipa exists
        run: |
          if [ ! -f "runner.ipa" ]; then
            echo "runner.ipa not found in repository root. Place the IPA at the repository root or change the workflow to point to its path.";
            ls -la || true;
            exit 1;
          fi

      - name: Setup Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.x'

      - name: Install fastlane
        run: gem install fastlane -NV

      - name: Decode provisioning profile
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          python - <<'PY'
import os,base64
open('profile.mobileprovision','wb').write(base64.b64decode(os.environ['MOBILEPROVISION_BASE64']))
PY

      - name: Decode p12
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
        run: |
          python - <<'PY'
import os,base64
open('cert.p12','wb').write(base64.b64decode(os.environ['P12_BASE64']))
PY

      - name: Create and unlock keychain, import certificate
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -e
          KEYCHAIN="$HOME/Library/Keychains/build.keychain"
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain || true
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN"

      - name: Re-sign with fastlane
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          # fastlane's resign action will create runner-resigned.ipa
          fastlane run resign ipa:"runner.ipa" signing_identity:"$SIGNING_IDENTITY" provisioning_profile:"profile.mobileprovision" output_path:"./"

      - name: Upload resigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: runner-resigned-ipa
          path: ./runner-resigned.ipa
